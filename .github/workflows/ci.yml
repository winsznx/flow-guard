# pnpm/action-setup deliberately has no `version:`. It errors when one is given
# alongside `packageManager` in package.json, and reading the version from there
# keeps CI on the same pnpm as local checkouts — which the overrides in
# pnpm-workspace.yaml depend on, since pnpm only reads them from 10.6 onwards.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CI: 'true'
  NODE_ENV: 'test'

jobs:
  contracts:
    name: Contracts (compile + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Compile every covenant (cashc check + build)
        working-directory: contracts
        run: |
          pnpm run check
          pnpm run build
      - name: Verify built artifacts exist
        working-directory: contracts
        run: |
          set -e
          for f in artifacts/treasury/VaultCovenant.json \
                   artifacts/treasury/ProposalCovenant.json \
                   artifacts/streaming/VestingCovenant.json \
                   artifacts/streaming/FtVestingCovenant.json \
                   artifacts/streaming/HybridVestingCovenant.json \
                   artifacts/streaming/RecurringPaymentCovenant.json \
                   artifacts/streaming/TrancheVestingCovenant.json \
                   artifacts/distribution/AirdropCovenant.json \
                   artifacts/distribution/RewardCovenant.json \
                   artifacts/distribution/BountyCovenant.json \
                   artifacts/distribution/GrantCovenant.json \
                   artifacts/streaming/VestingCovenantV2.json \
                   artifacts/streaming/HybridVestingCovenantV2.json \
                   artifacts/streaming/RecurringPaymentCovenantV2.json \
                   artifacts/streaming/TrancheVestingCovenantV2.json \
                   artifacts/distribution/AirdropCovenantV2.json \
                   artifacts/distribution/RewardCovenantV2.json \
                   artifacts/distribution/BountyCovenantV2.json \
                   artifacts/distribution/GrantCovenantV2.json \
                   artifacts/governance/VoteLockCovenant.json \
                   artifacts/governance/TallyCommitment_FixedMax.json \
                   artifacts/governance/TallyCommitment_Attested.json; do
            test -s "$f" || { echo "missing or empty artifact: $f" >&2; exit 1; }
          done
      - name: No artifact drift (rebuild must match what is committed)
        run: node scripts/check-artifact-drift.mjs

  backend:
    name: Backend (typecheck + build)
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build contracts (so backend artifact imports resolve)
        working-directory: contracts
        run: pnpm run build
      - name: Typecheck
        working-directory: backend
        run: pnpm exec tsc --noEmit -p tsconfig.json
      - name: Build
        working-directory: backend
        run: pnpm build
      - name: SIWX smoke tests
        working-directory: backend
        run: pnpm test:siwx

  frontend:
    name: Frontend (typecheck + production build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: frontend
        run: pnpm exec tsc --noEmit -p tsconfig.json
      - name: Production build
        working-directory: frontend
        run: pnpm exec vite build

  sdk:
    name: SDK (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: sdk
        run: pnpm exec tsc --noEmit -p tsconfig.json
      - name: Typecheck examples
        working-directory: sdk
        run: pnpm exec tsc --noEmit -p tsconfig.examples.json
      - name: Build
        working-directory: sdk
        run: pnpm build

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      # Builds the images the VPS actually runs. `pnpm build` in the repo passes
      # whether or not a file is COPYed into the image, so nothing else here can
      # catch a Dockerfile that omits one — that failure only showed up at deploy.
      # Build only; nothing is pushed.
      - name: Build backend image
        run: docker build -f Dockerfile.backend -t flowguard-backend:ci .
      - name: Build indexer image
        run: docker build -f Dockerfile.indexer -t flowguard-indexer:ci .
      - name: Schema reached dist in the built image
        run: |
          docker run --rm --entrypoint sh flowguard-backend:ci \
            -c 'test -s dist/database/postgres-schema.sql && test -s dist/index.js'

  audit:
    name: pnpm audit (advisory budget)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Audit (informational, fails the job for HIGH or higher)
        run: pnpm audit --audit-level high
