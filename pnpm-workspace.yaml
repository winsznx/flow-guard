packages:
  - 'contracts'
  - 'frontend'
  - 'backend'
  - 'shared'
  - 'sdk'

# Force vulnerable transitive dependencies to patched versions. Each entry is
# justified in docs/internal/security/PACKAGE_UPDATES.md (gitignored).
# Major-version-bounded (e.g. ^0.1.13) where the host package depends on a
# specific major; loose >= where the consumer is major-stable.
#
# Lives here, not under `pnpm.overrides` in package.json: pnpm 11 stopped reading
# the `pnpm` field entirely, so the pins were silently dropped while the lockfile
# still recorded them — every frozen install failed with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
# pnpm reads overrides from this file since 10.6, so CI (pnpm 10) and local (pnpm 11) agree.
overrides:
  tar: ^7.5.11
  qs: ^6.14.2
  path-to-regexp: ^0.1.13
  minimatch: ^9.0.7
  brace-expansion: ^2.1.6
  picomatch: ^4.0.4
  serialize-javascript: ^7.0.5
  flatted: ^3.4.2
  esbuild: ^0.25.0
  rollup: ^4.59.0
  postcss: ^8.5.18
  nanoid: ^3.3.18
  # Two majors are in the tree at once: jest pulls 3.x, eslint pulls 4.x. A single
  # override would force one consumer onto the wrong major, so each is pinned
  # inside its own range.
  'js-yaml@>=3.0.0 <4.0.0': ^3.15.2
  'js-yaml@>=4.0.0': ^4.3.2
  h3: ^1.15.9
  defu: ^6.1.5
  ajv: ^6.14.0
  bn.js: ^5.2.3
  '@tootallnate/once': ^3.0.1
  uuid: ^14.0.0
  browserslist: ^4.28.7
  source-map-js: ^1.2.2
  proxy-addr: ^2.0.8
  body-parser: ^1.20.9
  'zod@>=4.0.0 <4.6.6': ^4.6.6
  'ws@>=8.0.0 <8.21.0': 8.21.0
  'ws@>=7.0.0 <7.5.11': 7.5.11
